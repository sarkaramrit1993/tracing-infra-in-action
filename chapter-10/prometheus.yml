global:
  scrape_interval: 15s

# sample_limit makes a scrape that returns more series than expected fail whole
# (up drops to 0) instead of filling the store. Each span-metrics job has its own.
scrape_configs:
  - job_name: edge-spanmetrics
    sample_limit: 5000
    static_configs:
      - targets: ["edge-collector:8889"]

  - job_name: sampler-spanmetrics
    sample_limit: 5000
    static_configs:
      - targets: ["sampler-collector:8890"]

  - job_name: collectors
    static_configs:
      - targets: ["edge-collector:8888", "sampler-collector:8888"]

  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]

  # The target file is empty until cardinality-blast.sh writes the user.id
  # Collector into it, and cardinality-down.sh empties it again. Its own
  # sample_limit is deliberately lower than the connector's worst case.
  - job_name: edge-userid-spanmetrics
    sample_limit: 50000
    file_sd_configs:
      - files: ["/etc/prometheus/targets/edge-userid.json"]
        refresh_interval: 15s
