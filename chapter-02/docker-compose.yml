services:
  checkout-service:
    build: ./app
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - OTEL_SERVICE_NAME=checkout-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      # Listing 2.1: SDK batch configuration environment variables
      - OTEL_BSP_MAX_EXPORT_BATCH_SIZE=512
      - OTEL_BSP_SCHEDULE_DELAY=5000
      - OTEL_BSP_MAX_QUEUE_SIZE=2048
      - OTEL_BSP_EXPORT_TIMEOUT=30000
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.154.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./collector/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI
    # Jaeger v2 listens on OTLP gRPC :4317 inside the container
    # (reached as jaeger:4317 from the otel-collector service).

  stand-in-model:
    build: ./agent
    image: tracing-in-action-agent:ch02
    profiles: ["agent"]
    command: ["python", "stand_in_model.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 15

  agent:
    build: ./agent
    image: tracing-in-action-agent:ch02
    profiles: ["agent"]
    environment:
      - OTEL_SERVICE_NAME=support-agent
      - OTEL_RESOURCE_ATTRIBUTES=service.version=1.0.0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SEMCONV_STABILITY_OPT_IN=gen_ai_latest_experimental
      - OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=${OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT:-no_content}
      - AGENT_PROMPT_SIZE=${AGENT_PROMPT_SIZE:-8k}
      - AGENT_RUN_SECONDS=${AGENT_RUN_SECONDS:-short}
      - AGENT_RUNS=${AGENT_RUNS:-1}
      - STAND_IN_URL=http://stand-in-model:8000
      - CHECKOUT_URL=http://checkout-service:8080
    volumes:
      - ./agent/results:/agent/results
    depends_on:
      stand-in-model:
        condition: service_healthy
      otel-collector:
        condition: service_started
      checkout-service:
        condition: service_healthy
