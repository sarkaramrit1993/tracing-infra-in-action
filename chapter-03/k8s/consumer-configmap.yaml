# Consumer collector config: reads the otlp_spans topic the gateway produces
# to, then exports OTLP to Jaeger. This closes the loop so a reader running
# the k8s path can see traces in the Jaeger UI, while the gateway keeps
# exporting to Kafka exactly as it would in production.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-consumer-config
  namespace: observability
data:
  config.yaml: |
    receivers:
      kafka:
        brokers:
        - kafka-0.kafka-headless.kafka.svc:9092
        traces:
          topics: [otlp_spans]
          encoding: otlp_proto
        group_id: otel-consumer
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 800
        spike_limit_mib: 200
      batch:
        send_batch_size: 1000
        timeout: 5s
    exporters:
      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [kafka]
          processors: [memory_limiter, batch]
          exporters: [otlp/jaeger]
