# Listing 3.16: PrometheusRule alerts for collector health
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: otel-collector-alerts
  namespace: observability
spec:
  groups:
  - name: otel-collector
    rules:
    - alert: CollectorSpansRefused
      expr: rate(otelcol_receiver_refused_spans[5m]) > 0
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "Collector refusing spans"
        description: "{{ $labels.pod }} is refusing spans at the receiver"
    - alert: CollectorExportFailures
      expr: rate(otelcol_exporter_send_failed_spans[5m]) > 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Collector export failures"
        description: "{{ $labels.pod }} failing to export spans"
    - alert: CollectorHighMemory
      expr: >
        container_memory_usage_bytes{pod=~"otel-.*"}
        / container_spec_memory_limit_bytes > 0.85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Collector memory above 85% of limit"
        description: "{{ $labels.pod }} memory above 85%"
    - alert: CollectorQueueBacklog
      expr: otelcol_exporter_queue_size > 1000
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Collector export queue backing up"
        description: "{{ $labels.pod }} has {{ $value }} spans queued"
