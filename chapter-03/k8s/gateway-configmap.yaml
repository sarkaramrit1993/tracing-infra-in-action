# Listing 3.13: Gateway ConfigMap with health check filtering,
# cluster enrichment, and Kafka export
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway-config
  namespace: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 16
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 3500
        spike_limit_mib: 500
      batch:
        send_batch_size: 10000
        timeout: 5s
        send_batch_max_size: 15000
      resource:
        attributes:
        - key: k8s.cluster.name
          value: production-us-west-2
          action: upsert
        - key: deployment.environment
          value: production
          action: upsert
      filter:
        error_mode: ignore
        traces:
          span:
          - 'name == "health"'
          - 'name == "healthz"'
          - 'name == "ready"'
          - 'name == "readiness"'
          - 'name == "liveness"'
    exporters:
      kafka:
        brokers:
        - kafka-0.kafka-headless.kafka.svc:9092
        - kafka-1.kafka-headless.kafka.svc:9092
        - kafka-2.kafka-headless.kafka.svc:9092
        topic: otlp_spans
        encoding: otlp_proto
        producer:
          max_message_bytes: 10000000
          required_acks: 1
          compression: lz4
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
        check_collector_pipeline:
          enabled: true
          interval: 5s
          exporter_failure_threshold: 5
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter, resource, batch]
          exporters: [kafka]
