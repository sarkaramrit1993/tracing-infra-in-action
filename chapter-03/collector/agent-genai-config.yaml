# Demo agent tier for the agent workload. Same receiver, memory limiter, retry and queue
# settings as agent-config.yaml, with four differences that make one request easy to read:
# one plain otlp_grpc exporter to gateway 1 (the load-balancing exporter does not publish
# send_failed_spans), compression off, a 30 s batch timer so a whole run leaves as one request,
# and the checkout-service health spans dropped so they do not open a batch window of their own.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
    limit_percentage: 0
    spike_limit_percentage: 0
  filter/drop_health:
    error_mode: ignore
    traces:
      span:
        - 'name == "GET /health"'
  batch:
    send_batch_size: 1000
    timeout: 30s

exporters:
  otlp_grpc/gateway:
    endpoint: otel-gateway-1:4317
    timeout: 10s
    compression: none
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop_health, batch]
      exporters: [otlp_grpc/gateway]
