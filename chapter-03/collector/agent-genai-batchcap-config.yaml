# Demo agent tier with a cap on spans per batch: agent-genai-config.yaml with send_batch_size
# lowered to 100 and send_batch_max_size set to 100, so no export request holds more than 100 spans.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
    limit_percentage: 0
    spike_limit_percentage: 0
  filter/drop_health:
    error_mode: ignore
    traces:
      span:
        - 'name == "GET /health"'
  batch:
    send_batch_size: 100
    send_batch_max_size: 100
    timeout: 30s

exporters:
  otlp_grpc/gateway:
    endpoint: otel-gateway-1:4317
    timeout: 10s
    compression: none
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop_health, batch]
      exporters: [otlp_grpc/gateway]
