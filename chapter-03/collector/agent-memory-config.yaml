# Agent with in-memory sending queue (no file_storage)
# Mirrors persistent-queue-config.yaml exactly except queue backing
# Used by bench_persistent_queue.py Phase A for fair A/B comparison

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  batch:
    send_batch_size: 1000
    timeout: 5s

exporters:
  otlp:
    endpoint: otel-gateway-1:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
      queue_size: 100000

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp]
