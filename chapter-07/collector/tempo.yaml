# Grafana Tempo, monolithic config for the block archetype (section 7.3).
#
# Tempo writes immutable Parquet-shaped blocks to the same MinIO object store
# that backs ClickHouse's s3_cold disk, so both archetypes in this stack land
# in object storage and the contrast is the layout, not the medium: a wide
# column store you scan with SQL against opaque blocks you look up by id.
#
# SUPPORTED VERSION: Tempo 2.9 or newer. The stack pins 3.0.2 and every number
# in RESULTS.md and the exercises came off that. 2.9.4 also runs this file: it
# parses, starts, ingests from the Collector and answers /api/traces. Anything
# at 2.8 or older refuses to start, with
#   failed parsing config: ... field live_store not found in type app.Config
# and the fix is to upgrade, not to edit this file back.
#
# Tempo 3.0 (Project Rhythm, section 7.4.4) removed the `ingester` and
# `compactor` sections. Block building moved to `live_store` and retention to
# `backend_scheduler`, and 2.9 already accepted both of those, which is why the
# floor is 2.9 rather than 3.0. Going the other way is a hard break: a config
# still spelling `ingester` fails on 3.0 with the same shape of error.
# Monolithic mode runs both in-process and needs no Kafka; the Kafka-backed
# ingest path 7.4.4 describes is a microservices-mode option.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

live_store:
  # Was ingester.max_block_duration before 3.0. Deliberately short so a block
  # is cut and flushed to the bucket while you are still watching.
  max_block_duration: 30s

backend_scheduler:
  provider:
    compaction:
      compaction:
        # Tempo's cold boundary: whole blocks expire. Listing 7.2 expresses the
        # same boundary as a per-part TTL. Same two days, different unit of work.
        block_retention: 48h

storage:
  trace:
    backend: s3
    wal:
      path: /var/tempo/wal
    s3:
      endpoint: minio:9000
      bucket: tempo-blocks
      access_key: traceadmin
      secret_key: traceadmin-secret
      insecure: true          # plain HTTP inside the compose network
      forcepathstyle: true    # MinIO serves path-style, not virtual-host-style
