# Chapter 7 (Trace Storage Patterns) companion stack, continuous with chapter-05/.
#
# Path:  checkout -> otel-collector (partition_traces_by_id) -> kafka(otlp_spans)
#        -> consumer-clickhouse -> ClickHouse otel_traces (listing 7.1)
#
# Chapter 7 is about the STORE, so the topology is deliberately lighter than
# chapter 5's: one Kafka broker instead of three, no Flink, no Jaeger. The
# Collector export contract (partition_traces_by_id + otlp_spans topic) is
# identical to chapter-05/, so the same span stream lands in the listing 7.1
# table. ClickHouse is the primary backend. The Collector also fans the same
# span stream to Grafana Tempo, the object-storage block archetype of section
# 7.3, so both archetypes run side by side over one workload and both write to
# the same S3-compatible object store (SeaweedFS).
#
# Pinned versions (one tag per image, N1):
#   apache/kafka                                  4.3.0
#   otel/opentelemetry-collector-contrib          0.154.0
#   clickhouse/clickhouse-server                  25.8
#   grafana/tempo                                 3.0.2
#   prom/prometheus                               v3.12.0
#   chrislusf/seaweedfs                           4.47

x-kafka-env: &kafka-env
  KAFKA_NODE_ID: 1
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
  KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
  KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_NUM_PARTITIONS: 16
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

x-kafka-healthcheck: &kafka-healthcheck
  test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9093"]
  interval: 10s
  timeout: 10s
  retries: 10
  start_period: 30s

networks:
  ch7:
    driver: bridge

volumes:
  kafka-data:
  clickhouse-data:
  tempo-data:
  seaweedfs-data:

services:
  # --- Application: checkout producer (same trace shape as chapter 5) ---
  checkout-service:
    build: ./app
    networks: [ch7]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OTEL_SERVICE_NAME: checkout-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_BSP_SCHEDULE_DELAY: "5000"
    command: ["python", "checkout.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      otel-collector:
        condition: service_started

  # --- OTel Collector: OTLP in, partition-by-trace-id, fan-out to Kafka + Tempo ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.154.0
    networks: [ch7]
    volumes:
      - ./collector/gateway-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8888:8888"
    depends_on:
      kafka:
        condition: service_healthy
      # service_started, not service_healthy, because the Tempo image cannot
      # host a healthcheck. See the note on the tempo service below.
      tempo:
        condition: service_started

  # --- Kafka (single-broker KRaft, no ZooKeeper) ---
  kafka:
    image: apache/kafka:4.3.0
    networks: [ch7]
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      <<: *kafka-env
    healthcheck: *kafka-healthcheck
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.0
    networks: [ch7]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Creating otlp_spans topic..."
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic otlp_spans \
          --partitions 16 --replication-factor 1 \
          --config retention.ms=86400000 \
          --config cleanup.policy=delete \
          --config min.insync.replicas=1 \
          --bootstrap-server kafka:9093
        echo "Topic created."

  # --- SeaweedFS: the S3-compatible object store behind the cold tier (section 7.4.2) ---
  # ClickHouse's s3_cold disk (config.d/storage.xml) writes cold parts here as S3
  # objects, the same API AWS S3, GCS, and Azure Blob expose. Tempo writes its
  # blocks here too. `weed mini` runs a whole single-node store in one process and
  # creates both buckets on startup: traces-cold for ClickHouse, tempo-blocks for
  # Tempo. The AWS_* pair becomes the S3 admin identity, the same demo key pair
  # storage.xml and tempo.yaml carry. With it set, anonymous requests get 403.
  # The healthcheck waits for both buckets, because ClickHouse validates the
  # s3_cold disk on boot and Tempo writes to its bucket as soon as it starts.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    networks: [ch7]
    command: ["mini", "-dir=/data", "-bucket=traces-cold,tempo-blocks"]
    environment:
      AWS_ACCESS_KEY_ID: traceadmin
      AWS_SECRET_ACCESS_KEY: traceadmin-secret
    volumes:
      - seaweedfs-data:/data
    ports:
      - "127.0.0.1:8333:8333"   # S3 API
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8888/buckets/traces-cold/ && wget -q -O /dev/null http://localhost:8888/buckets/tempo-blocks/"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  # --- ClickHouse: the listing 7.1 store, primary backend ---
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    networks: [ch7]
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9363:9363"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d
      - ./clickhouse/users.d/z-allow-network.xml:/etc/clickhouse-server/users.d/z-allow-network.xml
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    depends_on:
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Storage-time consumer: Kafka otlp_spans -> ClickHouse otel_traces ---
  consumer-clickhouse:
    build: ./app
    networks: [ch7]
    command: ["python", "consumer_clickhouse.py"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9093
      KAFKA_TOPIC: otlp_spans
      KAFKA_GROUP: trace-storage-clickhouse
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy

  # --- Prometheus (collector + ClickHouse metrics) ---
  prometheus:
    image: prom/prometheus:v3.12.0
    networks: [ch7]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  # --- Grafana Tempo: the object-storage BLOCK archetype (section 7.3) ---
  # The second leg of the Collector's fan-out. Same spans as ClickHouse gets,
  # stored as immutable Parquet-shaped blocks in SeaweedFS rather than as rows, so
  # the row-versus-block contrast is two live stores over one workload.
  #
  # No healthcheck, and not by preference. Tempo serves a readiness endpoint on
  # 3200/ready, but a compose healthcheck runs INSIDE the container and the
  # image ships one binary, /tempo, with no shell, no wget and no curl, so there
  # is nothing in there that can call it. Every other service here has a
  # healthcheck because its image has busybox or wget. What covers Tempo instead
  # is step 4 of tests/test_stack.sh, which asks 3200 from the host for a trace
  # the checkout service just produced. That is a stronger check than readiness:
  # a Tempo that answers /ready but drops spans still fails it.
  tempo:
    image: grafana/tempo:3.0.2
    networks: [ch7]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./collector/tempo.yaml:/etc/tempo/tempo.yaml
      - tempo-data:/var/tempo
    depends_on:
      seaweedfs:
        condition: service_healthy
    ports:
      - "127.0.0.1:3200:3200"   # Tempo HTTP/query
      - "127.0.0.1:4417:4317"   # Tempo OTLP gRPC (mapped off 4317 to avoid collector clash)
