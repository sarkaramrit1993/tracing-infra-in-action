name: verify

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate compose files
        run: |
          for f in chapter-02/docker-compose.yml \
                   chapter-03/docker-compose.yml \
                   chapter-04/docker-compose.yml \
                   chapter-05/docker-compose.yml \
                   chapter-07/docker-compose.yml; do
              docker compose -f "$f" config -q
          done
          docker compose -f chapter-03/docker-compose.yml \
                         -f chapter-03/docker-compose.benchmark.yml config -q
          docker compose -f chapter-03/docker-compose.yml \
                         -f chapter-03/docker-compose.single-tier.yml config -q

      - name: Parse collector, prometheus and kubernetes configs
        run: |
          python - <<'PY'
          import glob, sys, yaml
          bad = []
          paths = sorted(
              glob.glob("chapter-*/collector/*.yaml")
              + glob.glob("chapter-*/prometheus.yml")
              + glob.glob("chapter-03/k8s/*.yaml")
          )
          if not paths:
              sys.exit("no config files matched; the globs are wrong")
          for path in paths:
              try:
                  list(yaml.safe_load_all(open(path)))
              except yaml.YAMLError as exc:
                  bad.append(f"{path}: {exc}")
          if bad:
              sys.exit("\n".join(bad))
          print(f"{len(paths)} config files parse")
          PY

      - name: Parse the Grafana dashboard
        run: python -c "import json; json.load(open('chapter-03/dashboards/collector-health.json'))"

      # Each chapter's tests run against that chapter's own pinned
      # requirements, in their own virtualenv. The chapters pin different
      # OpenTelemetry versions, so a single shared environment cannot satisfy
      # both, and hand-picking a subset of packages hides the fact that these
      # tests import the full SDK. This also checks the requirements files
      # themselves still resolve.
      - name: Chapter 3 offline tests
        run: |
          python -m venv /tmp/venv-ch03
          /tmp/venv-ch03/bin/pip install --quiet --upgrade pip
          /tmp/venv-ch03/bin/pip install --quiet -r chapter-03/benchmarks/requirements.txt pytest
          /tmp/venv-ch03/bin/python -m pytest chapter-03/benchmarks/test_benchmarks.py -q

      - name: Chapter 5 offline tests
        run: |
          python -m venv /tmp/venv-ch05
          /tmp/venv-ch05/bin/pip install --quiet --upgrade pip
          /tmp/venv-ch05/bin/pip install --quiet -r chapter-05/app/requirements.txt pytest
          /tmp/venv-ch05/bin/python -m pytest \
            chapter-05/app/test_consumer_clickhouse.py \
            chapter-05/flink/test_assembly_helpers.py \
            chapter-05/benchmarks/test_atomicity_audit.py \
            -q

      - name: Chapter 7 offline tests
        run: |
          python -m venv /tmp/venv-ch07
          /tmp/venv-ch07/bin/pip install --quiet --upgrade pip
          /tmp/venv-ch07/bin/pip install --quiet -r chapter-07/tests/requirements.txt
          /tmp/venv-ch07/bin/python chapter-07/tests/test_static.py

      # These three gate the published record rather than the stack, and every
      # one of them has caught something: a listing table pointing at a file
      # that no longer carried its anchor, a RESULTS.md rendered from a local
      # run git had never seen, and a caveat that never reached the table it
      # belonged to. They need no chapter dependencies.
      - name: Repository gates
        run: |
          python -m pip install --quiet pytest
          python scripts/check_listing_anchors.py
          python scripts/render_results.py --check
          python -m pytest tests/test_scripts.py -q

      - name: Verification scripts are syntactically valid
        run: |
          for f in chapter-0*/tests/*.sh; do
              bash -n "$f" && echo "ok $f"
          done

  stack:
    # One chapter per runner, so they cannot collide on host ports and each
    # gets the whole runner's memory. Chapter 5 needs about 6 GB, more than a
    # typical laptop allocates to Docker, so this is the only place it gets
    # verified.
    name: live stack (${{ matrix.chapter }})
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - chapter: chapter-02
            settle: 30
          - chapter: chapter-03
            settle: 45
          - chapter: chapter-04
            settle: 90
          - chapter: chapter-05
            settle: 130
          # Chapter 7 brings up object storage as well as Kafka and ClickHouse,
          # and MinIO's bucket init has to finish before Tempo writes a block,
          # so it settles longer than chapter 5 despite running no Flink.
          - chapter: chapter-07
            settle: 150
    steps:
      - uses: actions/checkout@v4

      - name: Show available memory
        run: free -h

      - name: Start the stack
        working-directory: ${{ matrix.chapter }}
        run: |
          docker compose up -d
          sleep ${{ matrix.settle }}
          docker compose ps

      - name: Run the verification script
        working-directory: ${{ matrix.chapter }}
        run: bash tests/test_stack.sh

      # Chapter 7 is the only chapter with a second live script. It has to run
      # after test_stack.sh, not before: it leaves the listing 7.4 row policy in
      # place while it works, and that policy is TO ALL, so it would filter the
      # admin login every other assertion depends on.
      - name: Run the tenancy test
        if: matrix.chapter == 'chapter-07'
        working-directory: ${{ matrix.chapter }}
        run: bash tests/test_tenancy.sh

      - name: Show logs on failure
        if: failure()
        working-directory: ${{ matrix.chapter }}
        run: docker compose logs --tail 120

      - name: Tear down
        if: always()
        working-directory: ${{ matrix.chapter }}
        run: docker compose down -v
