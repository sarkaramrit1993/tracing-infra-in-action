# Shared Kafka broker config: KRaft mode, 3-node quorum, identical except for
# NODE_ID and ADVERTISED_LISTENERS (declared per-broker below).
x-kafka-common-env: &kafka-common-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9094,2@kafka-2:9094,3@kafka-3:9094
  KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_NUM_PARTITIONS: 6
  KAFKA_DEFAULT_REPLICATION_FACTOR: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

x-kafka-healthcheck: &kafka-healthcheck
  test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9093"]
  interval: 10s
  timeout: 10s
  retries: 10
  start_period: 30s

networks:
  ch4:
    driver: bridge

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:

services:
  # --- Application ---
  checkout-service:
    build: ./app
    networks: [ch4]
    ports:
      - "8080:8080"
    environment:
      OTEL_SERVICE_NAME: checkout-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-agent:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_EXPORTER_OTLP_HEADERS: x-tenant-id=acme-corp
      OTEL_BSP_SCHEDULE_DELAY: "5000"
      OTEL_BSP_MAX_QUEUE_SIZE: "2048"
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: "512"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      otel-agent:
        condition: service_started

  # --- OTel Agent (sidecar-style) ---
  otel-agent:
    image: otel/opentelemetry-collector-contrib:0.154.0
    networks: [ch4]
    volumes:
      - ./collector/agent-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    depends_on:
      otel-gateway:
        condition: service_started

  # --- OTel Gateway ---
  otel-gateway:
    image: otel/opentelemetry-collector-contrib:0.154.0
    networks: [ch4]
    volumes:
      - ./collector/${GATEWAY_CONFIG:-gateway-config.yaml}:/etc/otelcol-contrib/config.yaml
    ports:
      - "4327:4317"
      - "8889:8888"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  # --- Kafka Brokers (KRaft, no ZooKeeper) ---
  kafka-1:
    image: apache/kafka:4.3.1
    networks: [ch4]
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9093
    healthcheck: *kafka-healthcheck

  kafka-2:
    image: apache/kafka:4.3.1
    networks: [ch4]
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9093
    healthcheck: *kafka-healthcheck

  kafka-3:
    image: apache/kafka:4.3.1
    networks: [ch4]
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9093
    healthcheck: *kafka-healthcheck

  # --- Kafka Topic Initialization ---
  kafka-init:
    image: apache/kafka:4.3.1
    networks: [ch4]
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Listing 4.3: Creating the trace topic (dev-scale partition count)
        echo "Creating Kafka topics..."
        /opt/kafka/bin/kafka-topics.sh --create --topic otlp_spans \
          --partitions 6 --replication-factor 2 \
          --config retention.ms=86400000 \
          --config cleanup.policy=delete \
          --config min.insync.replicas=1 \
          --bootstrap-server kafka-1:9093
        /opt/kafka/bin/kafka-topics.sh --create --topic otlp_spans.DLT \
          --partitions 4 --replication-factor 2 \
          --config retention.ms=604800000 \
          --bootstrap-server kafka-1:9093
        echo "Topics created successfully."

  # --- OTel Consumer (reads from Kafka, writes to Jaeger) ---
  otel-consumer:
    image: otel/opentelemetry-collector-contrib:0.154.0
    networks: [ch4]
    volumes:
      - ./collector/consumer-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "8890:8888"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started

  # --- Jaeger (trace backend, v2 built on OTel Collector) ---
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    networks: [ch4]
    ports:
      - "16686:16686"

  # --- Prometheus (metrics) ---
  prometheus:
    image: prom/prometheus:v3.14.0
    networks: [ch4]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  # --- AI agent workload (docker compose --profile agent ...) ---
  stand-in-model:
    build: ../chapter-02/agent
    image: tracing-in-action-agent:ch02
    profiles: ["agent"]
    networks: [ch4]
    command: ["python", "stand_in_model.py"]
    environment:
      - STAND_IN_DELAY_SCALE=0.01
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 15

  agent:
    build: ../chapter-02/agent
    image: tracing-in-action-agent:ch02
    profiles: ["agent"]
    networks: [ch4]
    environment:
      - OTEL_SERVICE_NAME=support-agent
      - OTEL_RESOURCE_ATTRIBUTES=service.version=1.0.0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-agent:4317
      - OTEL_SEMCONV_STABILITY_OPT_IN=gen_ai_latest_experimental
      - OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=${OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT:-no_content}
      - OTEL_BSP_MAX_EXPORT_BATCH_SIZE=50
      - AGENT_PROMPT_SIZE=${AGENT_PROMPT_SIZE:-8k}
      - AGENT_MODEL_CALLS=${AGENT_MODEL_CALLS:-4}
      - AGENT_RUNS=${AGENT_RUNS:-1}
      - STAND_IN_URL=http://stand-in-model:8000
      - CHECKOUT_URL=http://checkout-service:8080
    depends_on:
      stand-in-model:
        condition: service_healthy
      otel-agent:
        condition: service_started
      checkout-service:
        condition: service_started
