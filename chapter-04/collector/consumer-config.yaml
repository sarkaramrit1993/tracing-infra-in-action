# Listing 4.7: Consumer collector with Kafka receiver
# The OTel Collector Kafka receiver handles offset commit, poll sizing, and
# cooperative rebalancing itself, so this file looks thinner than Listing 4.4's
# raw Kafka consumer config. To keep at-least-once delivery, a record is marked
# for commit only after the pipeline returns, and the pipeline returns only once
# the export to Jaeger finishes. No batch processor sits in the pipeline, because
# it returns as soon as it has buffered the data.
receivers:
  kafka:
    brokers:
      - kafka-1:9093
      - kafka-2:9093
      - kafka-3:9093
    protocol_version: "3.9.0"
    group_id: trace-storage
    initial_offset: earliest
    message_marking:
      after: true
    traces:
      topics: ["otlp_spans"]
      encoding: otlp_proto

exporters:
  otlp:
    endpoint: jaeger:4317
    tls:
      insecure: true
    sending_queue:
      wait_for_result: true

extensions:
  health_check: {}

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [kafka]
      exporters: [otlp]
  telemetry:
    metrics:
      level: detailed
