# The OTel Collector Kafka receiver handles offset commit, poll sizing, and
# cooperative rebalancing internally, so this file intentionally looks thinner
# than Listing 4.5's raw Kafka consumer config.
receivers:
  kafka:
    brokers:
      - kafka-1:9093
      - kafka-2:9093
      - kafka-3:9093
    protocol_version: "3.9.0"
    group_id: trace-storage
    initial_offset: earliest
    traces:
      topics: ["otlp_spans"]
      encoding: otlp_proto

processors:
  batch:
    send_batch_size: 4096
    timeout: 2s

exporters:
  otlp:
    endpoint: jaeger:4317
    tls:
      insecure: true

extensions:
  health_check: {}

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [kafka]
      processors: [batch]
      exporters: [otlp]
  telemetry:
    metrics:
      level: detailed
