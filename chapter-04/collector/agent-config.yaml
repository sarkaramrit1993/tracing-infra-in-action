receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        include_metadata: true
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  batch:
    send_batch_size: 512
    timeout: 1s
    metadata_keys: [x-tenant-id]

exporters:
  otlp:
    endpoint: otel-gateway:4317
    tls:
      insecure: true
    auth:
      authenticator: headers_setter

extensions:
  health_check: {}
  headers_setter:
    headers:
      - action: upsert
        key: x-tenant-id
        from_context: x-tenant-id

service:
  extensions: [health_check, headers_setter]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp]
  telemetry:
    metrics:
      level: detailed
