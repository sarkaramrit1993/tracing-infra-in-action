# Listing 4.1: Tenant context propagation and routing
#
# Routes spans to a dedicated or a shared Kafka topic based on tenant identity.
# This is the gateway-tier config from section 4.1.3. It is the same collector
# role as gateway-config.yaml, with routing added ahead of the Kafka exporters.
#
# The tenant.id resource attribute normally arrives from the SDK. The resource
# processor below only fills it in when it is missing: insert never overwrites
# a value the SDK already set, and the `unknown` fallback falls through to the
# shared pipeline. Spans tagged tenant.id=acme-corp go to the dedicated topic.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  # Gateway resource processor: fallback when the SDK did not set these
  resource:
    attributes:
      - key: tenant.id
        value: unknown
        action: insert
      - key: deployment.environment
        value: prod
        action: insert
  batch:
    send_batch_size: 8192
    timeout: 1s

# Gateway collector routing connector
connectors:
  routing:
    default_pipelines: [traces/shared]
    error_mode: propagate
    table:
      - context: resource
        statement: route() where attributes["tenant.id"] == "acme-corp"
        pipelines: [traces/dedicated]

exporters:
  # Enterprise tenant: its own topic, per the taxonomy in figure 4.5
  kafka/dedicated:
    brokers: [kafka-1:9093, kafka-2:9093, kafka-3:9093]
    protocol_version: "3.9.0"
    traces:
      topic: otlp_spans.tenant-a
      encoding: otlp_proto
    partition_traces_by_id: true
    producer:
      compression: lz4
      required_acks: 1
      max_message_bytes: 1000000
  # Everyone else shares the main topic
  kafka/shared:
    brokers: [kafka-1:9093, kafka-2:9093, kafka-3:9093]
    protocol_version: "3.9.0"
    traces:
      topic: otlp_spans
      encoding: otlp_proto
    partition_traces_by_id: true
    producer:
      compression: lz4
      required_acks: 1
      max_message_bytes: 1000000

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: detailed
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [routing]
    traces/dedicated:
      receivers: [routing]
      exporters: [kafka/dedicated]
    traces/shared:
      receivers: [routing]
      exporters: [kafka/shared]
